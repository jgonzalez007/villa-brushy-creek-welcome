
      <tr class="{{ row_class }}">
        <td>{{ lock_label }}</td>
        <td class="guest-name">{{ guest_name }}</td>
        <td>{{ code }}</td>
        <td>{{ slot }}</td>
        <td>{{ window_str }}</td>
        <td><span class="status-badge {{ expired_class }}">{{ expired_label }}</span></td>
        <td>
          {% if slot_confirmed %}
          <form method="POST" action="/doors/remove" onsubmit="return confirm('Remove this door code from the lock?');">
            {{ csrf_field }}
            <input type="hidden" name="code_id" value="{{ code_id }}">
            <button type="submit" class="delete-btn">Remove</button>
          </form>
          {% else %}
          <form method="POST" action="/doors/forget" onsubmit="return confirm('The lock never confirmed this code\'s slot, so it can\'t be removed from here. Remove it in the Kwikset app first. Drop it from this list now?');">
            {{ csrf_field }}
            <input type="hidden" name="code_id" value="{{ code_id }}">
            <button type="submit" class="delete-btn" title="Remove it in the Kwikset app first; this only drops it from this list">Forget</button>
          </form>
          {% endif %}
        </td>
      </tr>
