services:
  - type: web
    name: villa-brushy-creek-welcome
    runtime: python
    # Declared explicitly so the branch is set here rather than inherited.
    # When the service and the Blueprint live in the same repo -- as they do
    # here -- Render takes the service's branch from the Blueprint and makes
    # the dashboard's branch field read-only, so it cannot be changed there.
    # This repo has only ever had "main".
    #
    # Leave this out if preview environments are ever enabled: a pinned
    # branch overrides the pull request's own branch in previews, which
    # defeats the point of them.
    branch: main
    # Render retired the old named tiers ("starter", "standard", ...) in
    # favour of explicit CPU/RAM plan IDs. "0.5c-512mb" is what "starter"
    # became: same 0.5 CPU / 512 MB, same $7/mo, always-on.
    # Use "free" to test at no cost -- but note the free tier has no
    # persistent disk, so the "disk:" block below must be removed too.
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    # --workers 1 is intentional: this app refreshes OwnerRez itself on a
    # background thread once an hour. Multiple gunicorn workers would each
    # run their own copy of that thread, multiplying API calls unnecessarily.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0      # required by the iaqualink package (pool control)
      - key: OWNERREZ_USERNAME
        sync: false        # set manually in Render dashboard, not stored in git
      - key: OWNERREZ_TOKEN
        sync: false        # set manually in Render dashboard, not stored in git
      - key: WIFI_SSID
        sync: false        # optional -- omit entirely to hide the Wi-Fi section
      - key: WIFI_PASSWORD
        sync: false        # optional -- required unless WIFI_AUTH=nopass
      - key: WIFI_AUTH
        value: WPA          # WPA (covers WPA2/WPA3), WEP, or nopass
      - key: CLEANING_TASKS
        sync: false        # optional -- comma-separated list overriding the default checklist
      - key: IAQUALINK_USERNAME
        sync: false        # optional -- omit to leave /pool showing "not configured"
      - key: IAQUALINK_PASSWORD
        sync: false        # optional -- your iAqualink app login password
      - key: POOL_TIMEZONE
        value: America/Chicago   # used for pool schedule on/off times (Cedar Park, TX)
      - key: DB_PATH
        value: /var/data/app.db  # must live under the disk's mount path below to persist
      - key: KWIKSET_EMAIL
        sync: false        # optional -- omit to leave /doors showing "not connected"
      - key: KWIKSET_REFRESH_TOKEN
        sync: false        # optional -- from running auth-setup.js once, see README
      - key: KWIKSET_START_SLOT
        value: "5"          # slots below this are left alone -- avoids codes set manually via the Kwikset app
      - key: SECRET_KEY
        sync: false        # required for persistent sessions -- see README "Securing this site" section
      - key: ADMIN_USERNAME
        value: admin        # optional -- change the bootstrap admin's username before first deploy
      - key: PUBLIC_BASE_URL
        sync: false        # your real Render URL, e.g. https://villa-brushy-creek-welcome.onrender.com -- shown on /messages as the URL to enter as the OwnerRez OAuth App's Webhook URL
      - key: OWNERREZ_WEBHOOK_USER
        sync: false        # must match the "Webhook User" you set on your OwnerRez OAuth App's Developer/API settings page -- see README "Guest messages" section
      - key: OWNERREZ_WEBHOOK_PASSWORD
        sync: false        # must match the "Webhook Password" you set on that same OwnerRez OAuth App page
      - key: ANTHROPIC_API_KEY
        sync: false        # optional -- omit to leave /messages showing "AI drafting: Not configured" (manual replies still work)
    # SINGULAR "disk:", and a mapping rather than a list. A service gets
    # exactly one disk, so "disks:" with a "- " item is not valid and fails
    # the blueprint with:
    #     disks: field disk not found in file.Service
    # This has now regressed twice by being copy-pasted back from an older
    # revision (984b6eb fixed it, 87643d2 silently undid it). If you are
    # editing this file from an old copy, check this block first.
    disk:
      name: villa-brushy-creek-data
      mountPath: /var/data
      sizeGB: 1                 # tiny data (schedules/checklists) -- 1GB is already overkill
