services:
  - type: web
    name: villa-brushy-creek-welcome
    runtime: python
    plan: starter          # $7/mo, always-on. Change to "free" to test at no cost.
    buildCommand: pip install -r requirements.txt
    # --workers 1 is intentional: this app refreshes OwnerRez itself on a
    # background thread once an hour. Multiple gunicorn workers would each
    # run their own copy of that thread, multiplying API calls unnecessarily.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0      # required by the iaqualink package (pool control)
      - key: OWNERREZ_USERNAME
        sync: false        # set manually in Render dashboard, not stored in git
      - key: OWNERREZ_TOKEN
        sync: false        # set manually in Render dashboard, not stored in git
      - key: WIFI_SSID
        sync: false        # optional -- omit entirely to hide the Wi-Fi section
      - key: WIFI_PASSWORD
        sync: false        # optional -- required unless WIFI_AUTH=nopass
      - key: WIFI_AUTH
        value: WPA          # WPA (covers WPA2/WPA3), WEP, or nopass
      - key: CLEANING_TASKS
        sync: false        # optional -- comma-separated list overriding the default checklist
      - key: IAQUALINK_USERNAME
        sync: false        # optional -- omit to leave /pool showing "not configured"
      - key: IAQUALINK_PASSWORD
        sync: false        # optional -- your iAqualink app login password
      - key: POOL_TIMEZONE
        value: America/Chicago   # used for pool schedule on/off times (Cedar Park, TX)
      - key: DB_PATH
        value: /var/data/app.db  # must live under the disk's mount path below to persist
      - key: KWIKSET_EMAIL
        sync: false        # optional -- omit to leave /doors showing "not connected"
      - key: KWIKSET_REFRESH_TOKEN
        sync: false        # optional -- from running auth-setup.js once, see README
      - key: KWIKSET_ADMIN_TOKEN
        sync: false        # optional -- set a long random string to enable /admin/kwikset-reauth
    disks:
      - name: villa-brushy-creek-data
        mountPath: /var/data
        sizeGB: 1               # tiny data (schedules/checklists) -- 1GB is already overkill
